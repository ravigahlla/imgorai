<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImGORAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #111827;
    }
    p {
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    button:active { background: #1d4ed8; }
    #status {
      margin-top: 12px;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
    }
    .legend {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      font-weight: bold;
    }
    .badge-verified { background: #22c55e; }
    .badge-invalid { background: #ef4444; }
    .badge-none { background: #6b7280; }
  </style>
</head>
<body>
  <h1>ImGORAI</h1>
  <p>Verify image authenticity using C2PA content credentials.</p>
  <button id="check-page">Scan Page Images</button>
  <div id="status">Ready to scan</div>
  <div class="legend">
    <div class="legend-item">
      <span class="badge badge-verified">✓</span>
      <span>Verified C2PA credentials</span>
    </div>
    <div class="legend-item">
      <span class="badge badge-invalid">✗</span>
      <span>Invalid or tampered</span>
    </div>
    <div class="legend-item">
      <span class="badge badge-none">?</span>
      <span>No credentials found</span>
    </div>
  </div>
  <script type="module" src="src/popup/index.ts"></script>
</body>
</html>
